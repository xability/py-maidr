    theme: cosmo
    css: styles.css
    toc: true
    lang: en
    canonical-url: true
    author-meta: "(x)Ability Design Lab, University of Illinois Urbana-Champaign"
    link-external-icon: true
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)'
