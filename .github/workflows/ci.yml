name: CI

on:
  workflow_dispatch:

  push:
    branches-ignore:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"

  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"

jobs:
  test:
    # We want to run on external PRs, but not on our own internal PRs as they'll be run
    # by the push to the branch. Without this if check, checks are duplicated since
    # internal PRs match both the push and pull_request events.
    if:
      github.event_name == 'push' || github.event.pull_request.head.repo.full_name !=
      github.repository

    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check lockfile sync
        run: |
          if ! uv lock --check; then
            echo "Error: Lockfile is out of sync with pyproject.toml"
            echo "Please run 'uv lock' locally and commit the changes"
            exit 1
          fi

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        id: tests
        run: uv run pytest -vvv

  browser:
    name: Accessibility tests in a browser

    # Guarded like `test`: an internal PR fires both `push` and
    # `pull_request`, and this job installs a browser.
    if:
      github.event_name == 'push' || github.event.pull_request.head.repo.full_name !=
      github.repository

    runs-on: ubuntu-latest

    # The only tests that check what the library actually promises -- that
    # a chart can be reached and driven from the keyboard. Everything else
    # in the suite asserts on emitted markup, which cannot tell a working
    # chart from a well-formed one.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # The wheel arrives with `--all-extras` above; only the browser
      # binary is missing, and it is not a Python package.
      - name: Install the browser Playwright drives
        run: uv run playwright install --with-deps chromium

      - name: Run the browser tests
        run: uv run pytest tests/browser -vv --run-browser

  bare-install:
    name: Import with no extras

    # Guarded like `test` rather than like the lint jobs: an internal PR
    # fires both `push` and `pull_request`, and this job resolves and
    # installs matplotlib, scipy and seaborn from the index, which is a
    # test-sized cost rather than a lint-sized one.
    if:
      github.event_name == 'push' || github.event.pull_request.head.repo.full_name !=
      github.repository

    runs-on: ubuntu-latest

    # Every other job installs `--all-extras`, so none of them can see a
    # dependency that is imported but declared only as an extra -- or not
    # declared at all. That is how `pip install -U maidr`, the install both
    # the README and the docs give, shipped three releases that raised
    # `ModuleNotFoundError` on `import maidr`.
    #
    # Deliberately the documented install and nothing else: no extras, no
    # dev group, no test dependencies, and an import rather than a test run.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          # The floor `requires-python` promises, and the version where a
          # dependency is most likely to resolve differently.
          python-version: "3.9"

      - name: Install the package with no extras
        run: |
          uv venv /tmp/bare
          uv pip install --python /tmp/bare/bin/python .

      - name: Import it
        run: /tmp/bare/bin/python -c "import maidr; print(maidr.__file__)"

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Check lockfile sync
        run: |
          if ! uv lock --check; then
            echo "Error: Lockfile is out of sync with pyproject.toml"
            echo "Please run 'uv lock' locally and commit the changes"
            exit 1
          fi

      - name: Check format with ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --diff"
          version: "0.3.4"

      # A separate step because the one above cannot fail on this. FA102's
      # only fix is an unsafe one, so `check --diff` -- which reports fixable
      # diffs -- exits 0 with the fault present and the rule enabled.
      #
      # What it guards is not a style preference: a PEP 604 union (`str |
      # None`) in an annotation raises TypeError on Python 3.9, which
      # `requires-python` still promises, while the module is being imported.
      # Anything reachable from `maidr/__init__.py` therefore takes `import
      # maidr` down with it, and every interpreter from 3.10 up sees nothing.
      #
      # Scoped to this one rule rather than switching the step above to a
      # plain `check`, which would fail on findings that predate it.
      - name: Check Python 3.9 annotations with ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --select FA102"
          version: "0.3.4"

  commit-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install commitlint dependencies
        run: npm install @commitlint/config-conventional

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          failOnWarnings: 'false'
          commitDepth: 1

  workflow-lint:
    name: Lint workflows and shell scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # shellcheck is pre-installed on the ubuntu-latest runner image.
      - name: ShellCheck shell scripts
        run: shellcheck .github/scripts/*.sh

      # actionlint validates the workflow YAML and shellchecks inline `run`
      # blocks, catching the class of shell/quoting bugs this repo has hit.
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
