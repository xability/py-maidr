name: Test & Release

on:
  # Release on a weekly cadence rather than on every push to ``main``, matching
  # the upstream ``xability/maidr`` repo.  Upstream releases Mondays at 15:00
  # UTC; we run an hour later so the ``maidr`` npm package that the bundle step
  # below pulls from the registry is the release upstream just published, not
  # the previous week's.
  #
  # 16:00 UTC = 10 AM CST (winter) / 11 AM CDT (summer).  GitHub Actions cron
  # runs in UTC and does not observe DST.
  schedule:
    - cron: '0 16 * * 1'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `ci.yml` runs this before every install and `release.yml` never did.
      # `uv sync --locked` below fails on a stale lockfile anyway, but with a
      # resolver error rather than the sentence saying what to do about it --
      # and this is the run that publishes, so the difference is worth the
      # four lines.
      - name: Check lockfile sync
        run: |
          if ! uv lock --check; then
            echo "Error: Lockfile is out of sync with pyproject.toml"
            echo "Please run 'uv lock' locally and commit the changes"
            exit 1
          fi

      # Matches `ci.yml` rather than naming extras. A narrower install here
      # silently skipped every test guarded by `importorskip` -- the whole
      # Streamlit integration, because `streamlit` is deliberately not in the
      # `test` extra -- so the release ran a weaker suite than the pull
      # request that produced it.
      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        id: tests
        run: uv run pytest -vvv

  browser:
    name: Accessibility tests in a browser

    runs-on: ubuntu-latest

    # `release` needs this job, so a chart that cannot be driven from the
    # keyboard blocks the publish. That is the point: everything else in
    # the suite asserts on emitted markup, which cannot tell a working
    # chart from a well-formed one, and the release refreshes the bundled
    # `maidr.js` -- the change most able to break navigation while every
    # markup assertion still passes.
    #
    # No `if:` guard, unlike `ci.yml`: this workflow runs only on a
    # schedule or a manual dispatch, so there is no second event to
    # deduplicate against.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Install the browser Playwright drives
        run: uv run playwright install --with-deps chromium

      - name: Run the browser tests
        run: uv run pytest tests/browser -vv --run-browser

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Check format with ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --diff"
          version: "0.3.4"

  # NOTE: there is deliberately no ``commit-lint`` job here.  On a scheduled run
  # there is no push or pull-request payload to derive a commit range from --
  # ``wagoid/commitlint-github-action`` only supports ``push``,
  # ``pull_request``, and ``merge_group`` -- so gating the release on it would
  # risk blocking every release on undefined behaviour.  Commit messages are
  # already linted before they reach ``main`` by the ``commit-lint`` job in
  # ``ci.yml``, which runs on every pull request and branch push.

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    concurrency: release
    needs: [test, lint, browser]
    if: github.repository == 'xability/py-maidr'
    environment:
      name: pypi
      url: https://pypi.org/project/maidr/
    permissions:
      # https://docs.github.com/en/rest/overview/permissions-required-for-github-apps?apiVersion=2022-11-28#metadata
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Bundle latest upstream maidr.js into this release
        # Pull the newest upstream ``maidr.js`` and its assets at release
        # time so the exact assets shipped to PyPI (and recorded in the
        # changelog) match the upstream release that was current when
        # py-maidr cut its own release.  The refresh is committed locally
        # as ``xabilitylab`` but intentionally *not* pushed here: the
        # semantic-release step below pushes the branch, so this commit
        # ships only when a release actually happens, and when no release is
        # pending it is discarded with the runner.
        #
        # ``main`` may already carry a newer bundle than the last release:
        # ``update-maidr-js.yml`` refreshes it whenever upstream publishes.
        # That costs nothing here -- this step re-resolves the newest upstream
        # either way, and finds nothing to commit when the bundle is already
        # current -- and this step stays the authority on what users receive.
        run: |
          set -euo pipefail

          # Skip the refresh only when we are confident no release will be
          # cut for this push.  On any uncertainty we fall through and let
          # the semantic-release push gate whether the commit survives.
          NEXT=$(uv run semantic-release version --print 2>/dev/null || true)
          LAST=$(uv run semantic-release version --print-last-released 2>/dev/null || true)
          if [ -n "$NEXT" ] && [ -n "$LAST" ] && [ "$NEXT" = "$LAST" ]; then
            echo "No release pending (version stays at $LAST); skipping bundle refresh."
            exit 0
          fi
          echo "Release pending (${LAST:-<none>} -> ${NEXT:-<unknown>}); refreshing bundle."

          # Resolve, download, and verify the latest upstream bundle via the
          # shared script (also used by update-maidr-js.yml).
          VERSION=$(.github/scripts/fetch-maidr-bundle.sh)

          # Commit as xabilitylab only when the bundle actually changed, so a
          # release that is already on the newest upstream does not fail on an
          # empty commit.  Scope the identity to this single commit (-c /
          # --author) so it does not persist into the repo config and bleed
          # into the semantic-release commit that follows.  Not pushed here --
          # semantic-release pushes the branch below.
          # ``maidr/static`` wholesale rather than a list of filenames:
          # the bundle gained ``maidr-math.css`` in maidr 3.75.1, and a
          # list that had not been updated would have left it behind in
          # the runner while the release shipped without it.
          git add maidr/static
          if git diff --cached --quiet; then
            echo "Bundle already at v${VERSION}; nothing to commit."
          else
            git -c user.name="xabilitylab" \
                -c user.email="187909674+xabilitylab@users.noreply.github.com" \
                commit -m "chore: update bundled maidr.js to v${VERSION}" \
                --author="xabilitylab <187909674+xabilitylab@users.noreply.github.com>"
          fi

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9.21.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changelog: true
          commit: true
          push: true

      - name: Build and publish package distributions to PyPI
        id: pypi-publish
        # NOTE: DO NOT wrap the conditional in ${{ }} as it will always evaluate to true.
        # See https://github.com/actions/runner/issues/1173
        if: steps.release.outputs.released == 'true'
        run: |
          # Use a clean environment for building
          uv build --no-cache
          uv publish
