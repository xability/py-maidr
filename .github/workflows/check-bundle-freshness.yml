name: Check bundled maidr.js freshness

# Catch bundle drift *before* it ships.
#
# The bundled ``maidr.js`` is refreshed at release time (see release.yml),
# so between releases it falls behind whatever upstream has published.  At
# runtime py-maidr warns about that — but only for users whose session
# already resolved a version, which by construction excludes the offline
# and pinned users the warning is most for.  Nothing at runtime can reach
# someone who never contacts the network.
#
# So the drift has to be caught here, before a wheel is built with a stale
# bundle inside it.  This job asks the library itself, via
# ``maidr.bundle_status()``, so the staleness threshold lives in exactly
# one place (``STALE_MINOR_GAP``) rather than being duplicated in YAML.
#
# It fails rather than opening an issue: a red scheduled workflow already
# mails the maintainers and shows in the Actions tab, without accumulating
# duplicate issues week after week.

on:
  schedule:
    # Mondays, off the hour — scheduled jobs pile up at :00 across GitHub.
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compare bundled maidr.js against npm
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Compare bundled version against the published release
        run: |
          uv run python - <<'PY'
          import sys

          from maidr import STALE_MINOR_GAP, bundle_status, resolver_outcome

          # bundle_status() re-raises rather than caches a lookup that
          # failed in a way it is written not to.  That is right for a
          # render -- a resolver bug should be visible -- but here it
          # would produce a red run with a traceback, which reads as
          # drift and is exactly what the "not a drift signal" branch
          # below exists to avoid saying.
          try:
              status = bundle_status()
          except Exception as exc:
              print(f"::warning::Version lookup raised {exc!r}; skipping.")
              sys.exit(0)

          print(f"bundled:   {status.bundled}")
          print(f"published: {status.published}")

          if status.published is None:
              # Passing on a failed lookup is right for a hiccup and wrong
              # for a persistent failure: a job that skips forever stays
              # green while checking nothing, and a green check that
              # verifies nothing is worse than a red one because it is
              # indistinguishable from a real pass (#298).
              #
              # What separates them is *how* it failed.  An endpoint that
              # never answered is the network, which nobody reading this
              # job can fix.  An endpoint that answered with something
              # py-maidr could not use is py-maidr being wrong about its
              # shape -- an API that moved or changed its payload -- and
              # that is the long-lived cause this job most needs to catch,
              # because it will not fix itself.
              outcome = resolver_outcome()

              if outcome is not None and outcome.answered_badly:
                  print(
                      "::error::Every resolver that answered gave something "
                      f"py-maidr could not read: {', '.join(outcome.answered_badly)}. "
                      "This is not a network problem -- the endpoints replied. "
                      "Check whether their payload shape changed, in "
                      "_RESOLVER_ENDPOINTS and _fetch_latest_version."
                  )
                  sys.exit(1)

              unreachable = ", ".join(outcome.unreachable) if outcome else "all"
              print(
                  f"::warning::Could not reach any resolver ({unreachable}); "
                  "skipping. Nothing answered, so this says nothing about "
                  "whether the bundle has drifted."
              )
              sys.exit(0)

          if status.is_stale:
              print(
                  f"::error::Bundled maidr.js ({status.bundled}) is at least "
                  f"{STALE_MINOR_GAP} minor versions behind the published "
                  f"release ({status.published}). Run the 'Update bundled "
                  f"maidr.js' workflow before the next release."
              )
              sys.exit(1)

          if status.is_behind:
              print(
                  f"::notice::Bundled maidr.js ({status.bundled}) is behind "
                  f"{status.published}, but within the {STALE_MINOR_GAP}-minor "
                  f"threshold. The next release will refresh it."
              )

          print("Bundle is current enough.")
          PY
