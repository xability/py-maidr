filters:
  - interlinks
  - line-highlight


interlinks:
  fast: true
  sources:
    numpy:
      url: https://numpy.org/doc/stable/
    python:
      url: https://docs.python.org/3/

quartodoc:
  package: maidr
  dir: api
  title: API Reference
  style: pkgdown
  dynamic: true
  render_interlinks: true
  sections:
    - title: Displaying an accessible and interactive plot with multimodal formats
      desc: >
        Plots generated by **matplotlib**, **seaborn**, **Plotly** or **Altair**
        can be displayed in MAIDR format. Pass the plot object to `maidr.show()`,
        or call `plt.show()` after `import maidr` and let the custom backend do it.
      contents:
        - show
        - render
        - Maidr.show
    - title: Saving a maidr plot as an HTML file
      desc: >
        Save a plot as a standalone HTML file with `maidr.save_html()`.
      contents:
        - save_html
        - Maidr.save_html
    - title: Registering and releasing figures
      desc: >
        Mark a bar container as a stacked bar plot with `maidr.stacked()`, and
        release the figures maidr tracks with `maidr.close()`.
      contents:
        - stacked
        - close
    - title: Switching the matplotlib backend
      desc: >
        Control whether `plt.show()` uses the maidr accessible backend or the
        platform default with `maidr.set_backend()`.
      contents:
        - set_backend
    - title: Where the maidr.js runtime comes from
      desc: >
        Choose between the jsDelivr CDN and the copy bundled in the wheel with
        `maidr.set_use_cdn()`, and emit the notebook loader by hand with
        `maidr.init_notebook()`.
      contents:
        - set_use_cdn
        - get_use_cdn
        - init_notebook
    - title: Shiny for Python
      desc: >
        Pair `output_maidr()` in the UI with `@render_maidr` in the server.
        Requires the `shiny` extra: `pip install "maidr[shiny]"`.
      package: maidr.widget
      contents:
        - name: shiny.output_maidr
          dynamic: false
        - name: shiny.render_maidr
          dynamic: false
    - title: Streamlit
      desc: >
        Place an accessible chart in a Streamlit app with `render_maidr()`, or
        get the HTML string to cache with `maidr_html()`.
        Requires the `streamlit` extra: `pip install "maidr[streamlit]"`.
      package: maidr.widget
      contents:
        - name: streamlit.render_maidr
          dynamic: false
        - name: streamlit.maidr_html
          dynamic: false
