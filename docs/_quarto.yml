project:
  type: website
  output-dir: _site
  # Files Quarto would not otherwise copy to _site (it only copies files that
  # pages reference, plus robots.txt / CNAME / 404.html).
  resources:
    - llms.txt
  # Runs before every render, after CI's `quartodoc build`: gives the
  # generated api/*.qmd pages a <title> and a meta description.
  pre-render: _scripts/api_front_matter.py


metadata-files:
  - api/_sidebar.yml


website:
  title: "py-maidr"
  description: "Python library that makes matplotlib, seaborn, Plotly and Altair charts accessible to blind and low-vision users with sonification, braille, text and AI."
  # Social preview image (shared with maidr.ai). A local file lets Quarto
  # emit og:image:width/height; a remote URL does not.
  image: "/media/logo.jpg"
  image-alt: "MAIDR logo - Data Insight for All"
  open-graph:
    locale: en_US
  twitter-card:
    card-style: summary_large_image
  # GA4 for traffic analytics
  google-analytics: "G-TL8SVL5VRE"
  # Cookie consent banner (GDPR compliance) — gates GA4 and Clarity
  cookie-consent:
    type: express
    style: simple
    palette: light

  # No trailing slash: Quarto joins site-url and resource paths verbatim, so a
  # trailing slash yields double-slash image URLs.
  site-url: https://py.maidr.ai
  repo-url: https://github.com/xability/py-maidr
  issue-url: https://github.com/xability/py-maidr/issues/new/choose
  repo-actions: [issue]

  page-navigation: true
  bread-crumbs: true

  navbar:
    background: light
    # logo: quarto.png
    logo-alt: "Maidr logo."
    logo-href: https://py.maidr.ai/
    title: py-maidr
    collapse-below: lg
    left:
      - file: index.qmd
        text: "Welcome"
      - text: "Examples"
        menu:
          - text: "Matplotlib / Seaborn (overview)"
            href: examples.qmd
          - text: "Bar, Stacked and Dodged Bar Charts"
            href: examples/bar.qmd
          - text: "Pie Charts and Word Clouds"
            href: examples/pie-wordcloud.qmd
          - text: "Histograms and KDE Plots"
            href: examples/histogram-kde.qmd
          - text: "Line and Step Plots"
            href: examples/line-step.qmd
          - text: "Heatmaps, Hexbin and Contour Plots"
            href: examples/heatmap-hexbin-contour.qmd
          - text: "Box, Boxen and Violin Plots"
            href: examples/box-boxen-violin.qmd
          - text: "Area, Error Bar, Point and Lollipop Plots"
            href: examples/area-errorbar-point-lollipop.qmd
          - text: "Scatter and Regression Plots"
            href: examples/scatter-regression.qmd
          - text: "Multi-Layer, Multi-Panel and Facet Plots"
            href: examples/multi-layer-panel-facet.qmd
          - text: "Candlestick and Gantt Charts"
            href: examples/candlestick-gantt.qmd
          - text: "Shiny and Streamlit Dashboards"
            href: examples/dashboards.qmd
          - text: "---"
          - text: "Plotly"
            href: examples-plotly.qmd
          - text: "Altair"
            href: examples-altair.qmd
      - file: stability.qmd
        text: "Plot Type Stability"
      - text: "API Reference"
        href: api/
    right:
      - icon: github
        href: https://github.com/xability/py-maidr
        aria-label: GitHub

  sidebar:
    - id: examples
      title: "Matplotlib / Seaborn Examples"
      style: docked
      collapse-level: 1
      contents:
        - text: "Overview"
          href: examples.qmd
        - section: "Plot families"
          contents:
            - examples/bar.qmd
            - examples/pie-wordcloud.qmd
            - examples/histogram-kde.qmd
            - examples/line-step.qmd
            - examples/heatmap-hexbin-contour.qmd
            - examples/box-boxen-violin.qmd
            - examples/area-errorbar-point-lollipop.qmd
            - examples/scatter-regression.qmd
            - examples/multi-layer-panel-facet.qmd
            - examples/candlestick-gantt.qmd
        - examples/dashboards.qmd
        - section: "Other libraries"
          contents:
            - examples-plotly.qmd
            - examples-altair.qmd

  page-footer:
    left: "© (x)Ability Design Lab, University of Illinois Urbana-Champaign"
    center: "[maidr.ai](https://maidr.ai/) | [r.maidr.ai](https://r.maidr.ai/) | [PyPI](https://pypi.org/project/maidr/)"
    right: "[GitHub](https://github.com/xability/py-maidr)"

