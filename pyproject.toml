[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maidr"
version = "1.23.0"
description = "Multimodal Access and Interactive Data Representations"
authors = [
    { name = "JooYoung Seo", email = "jseo1005@illinois.edu" },
    { name = "Saairam Venkatesh", email = "saairam2@illinois.edu" },
]
requires-python = ">=3.9"
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = [
    "accessibility",
    "visualization",
    "sonification",
    "braille",
    "tactile",
    "multimodal",
    "data representation",
    "blind",
    "low vision",
    "visual impairments",
]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.26",
    "lxml>=5.1.0",
    "htmltools>=0.5",
    "wrapt>=1.16.0,<2",
    "mplfinance>=0.12.10b0",
    # Imported while `import maidr` runs, so they are requirements rather
    # than extras whatever the `visualization` extra suggests: matplotlib
    # throughout the model layer, seaborn by `wrap_seaborn` in
    # `maidr/patch/barplot.py`, scipy by `maidr/core/plot/violin_kde_plot.py`.
    # matplotlib had been arriving only as an mplfinance dependency, which is
    # an accident rather than a promise.
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # 1.11 is the first scipy installable on every interpreter
    # `requires-python` promises: 1.10 caps itself at `<3.12`. The API used
    # (`interpolate.interp1d`) is far older than either, so the floor is
    # about which wheels exist, not about what the code needs.
    "scipy>=1.11",
]

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "statsmodels>=0.14.4",
    "flask>=3.0.0"
]
altair = [
    "altair>=5.0",
]
wordcloud = [
    # Optional, and read through duck typing rather than an import: the patch
    # on `Axes.imshow` recognises a cloud by its `words_` mapping, so nothing
    # in maidr imports this and a user without it is unaffected. Listed so
    # `pip install maidr[wordcloud]` gets a working pair, and so CI installs
    # the package the word cloud tests need in order not to skip.
    "wordcloud>=1.9",
]
jupyter = [
    "jupyter>=1.0.0,<2",
    "ipykernel>=6.0.0",
]
plotly = [
    "plotly>=5.0",
    # Traces the curves a `go.Contour` only declares -- plotly ships a grid
    # and a level spacing and computes them in the browser, so reading that
    # chart means running the same marching squares here. Imported lazily by
    # `maidr/plotly/contour.py` and by nothing else, so it belongs beside
    # `plotly` rather than in the base list, which is what `import maidr`
    # itself needs.
    #
    # Listed rather than relied upon: it already arrives with matplotlib, and
    # arriving with something is what the matplotlib entry in the base list
    # exists to stop treating as a promise.
    "contourpy>=1.0.1",
]
shiny = [
    "shiny>=1.0",
]
# `tests/widget/test_streamlit.py` stubs `streamlit` rather than importing
# it, so this extra is not listed under `test`: it would add nothing to what
# CI exercises. `uv sync --all-extras` installs it regardless, which is what
# locks `altair` to <6 on Python 3.9 -- the newest Streamlit that supports
# 3.9 is 1.50, and it caps altair there. Python 3.10+ is unaffected.
streamlit = [
    "streamlit>=1.30",
]
# Drives a real browser for the accessibility tests. Kept out of `test`
# because it needs a browser binary as well as the wheel, so a plain
# `uv sync --all-extras` should not imply the browser tests can run.
browser = [
    "playwright>=1.40",
]
test = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "altair>=5.0",
    "jupyter>=1.0.0,<2",
    "pytest>=7.3.2,<8",
    "pytest-mock>=3.12.0,<4",
    # Resolves an emitted CSS selector against the exported SVG, which is the
    # only way to check that a selector addresses the element its point
    # describes. `lxml` is already a runtime dependency; this is the CSS
    # front end for it.
    "cssselect>=1.2",
    "flask>=3.0.0",
    "plotly>=5.0",
    "shiny>=1.0",
]

# Allows ``matplotlib.use("maidr")`` (without the ``module://`` prefix).
# Requires matplotlib >= 3.9 (entry point discovery added in PR #27948).
# For matplotlib 3.8.x, use ``matplotlib.use("module://maidr.backend")``.
[project.entry-points."matplotlib.backend"]
maidr = "maidr.backend"

[project.urls]
Homepage = "https://xability.github.io/py-maidr"
Repository = "https://github.com/xability/py-maidr"

[dependency-groups]
dev = [
    "ruff==0.3.4",
    "pre-commit>=3.3.2,<4",
    "pytest>=7.3.2,<8",
    "python-semantic-release==9.21.0",
    "pytest-mock>=3.12.0,<4",
    "tox>=4.13.0,<5",
    "quartodoc>=0.8.0,<0.9",
    "griffe>=0.48,<1.0",
    "plotly>=6.5.2",
    "wordcloud>=1.9",
]

[tool.hatch.build.targets.wheel]
# ``packages`` picks up everything under ``maidr/``, including every
# prebuilt asset in ``maidr/static/``: ``maidr.js``, the ``maidr-math.css``
# it fetches at runtime, and the ``maidr.css`` placeholder kept for callers
# that still reference it.  So ``pip install maidr`` ships everything
# needed for ``offline=True`` rendering.
packages = ["maidr"]

[tool.hatch.build.targets.sdist]
include = [
    "maidr/**/*.py",
    "maidr/static/**",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# FA102 catches a PEP 604 union (`str | None`) in an annotation on a package
# that supports Python 3.9, where annotations are still evaluated at
# definition time. That is not a typing nicety there: it raises TypeError
# while the module is being imported, so anything reachable from
# `maidr/__init__.py` takes `import maidr` down with it, on the oldest
# interpreter `requires-python` promises. Local runs on 3.10+ see nothing,
# and the CI matrix reports it as one red job among fifteen rather than as
# "the package does not import".
#
# FA102 only, not the whole `FA` set: FA100 is a style opinion about
# `typing.Union[str, None]`, which runs perfectly well on 3.9 and accounts
# for every other finding here.
#
# `extend-select` rather than `select`, which would replace ruff's defaults
# (`E4`, `E7`, `E9`, `F`) rather than add to them.
extend-select = ["FA102"]

[tool.semantic_release]
build_command = "pip install uv && uv lock && git add uv.lock"
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
logging_use_named_masks = false
major_on_zero = false
tag_format = "v{version}"
version_variables = ["maidr/__init__.py:__version__", "pyproject.toml:version"]

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
# ``exclude_commit_patterns`` belongs to *this* table, not to
# ``changelog.default_templates``.  python-semantic-release parses its config
# with pydantic, which silently drops unknown keys, so while this list lived
# under ``default_templates`` it was never applied and every commit type landed
# in the changelog.
#
# The pattern is an allowlist expressed as a negative lookahead: a commit is
# excluded unless its subject starts with one of the listed types.  ``chore`` is
# deliberately absent -- the release-time ``chore: update bundled maidr.js to
# vX.Y.Z`` commits and dependency bumps are housekeeping, and they were crowding
# out the entries a reader of the release notes actually cares about.
#
# ``!?`` is what admits a breaking commit.  Written out type by type, every
# alternative ended in a literal ``): `` or ``: ``, so ``feat(deps)!: `` matched
# none of them and was excluded -- a breaking change would bump the major and
# then be missing from the changelog explaining it, which is the one entry a
# reader of a major release needs most.  ``tests/core/test_changelog_filter.py``
# holds this pattern to the same set of subjects the written-out form admitted,
# plus the breaking ones.
exclude_commit_patterns = [
  "^(?!(feat|fix|docs|perf|refactor|test|build|ci|style)(\\(.*\\))?!?: ).*"
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = true

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "perf", "refactor", "style", "test", "build", "chore", "ci"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
